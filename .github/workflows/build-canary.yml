name: 构建自定义镜像

on:
  push:
    branches:
      - canary
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出 canary 分支
        uses: actions/checkout@v6

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成构建元数据
        id: build_meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送镜像（arm64）
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/tray9985/lobehub:latest
          build-args: |
            NEXT_PUBLIC_BUILD_COMMIT=${{ steps.build_meta.outputs.commit }}
            NEXT_PUBLIC_BUILD_TIME=${{ steps.build_meta.outputs.date }}
